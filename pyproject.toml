[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drive-rl"
version = "0.2.0"
description = "Train a reinforcement-learning racing driver on MetaDrive."
readme = "README.md"
license = { file = "LICENSE" }
# MetaDrive requires Python < 3.12 (see its `requires_python` metadata), so the
# 3.10-3.11 range is deliberate rather than a legacy constraint.
requires-python = ">=3.10,<3.12"
authors = [{ name = "Learn-to-Drive-with-RL contributors" }]
keywords = ["reinforcement-learning", "ppo", "autonomous-driving", "racing", "metadrive"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Framework :: PyTorch",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Simulation. MetaDrive pins python <3.12 and brings Panda3D + Bullet.
    "metadrive-simulator>=0.4.3",
    # RL stack
    "stable-baselines3>=2.3.0",
    # Deep learning backend. On Windows, install a CUDA build explicitly:
    #   pip install torch --index-url https://download.pytorch.org/whl/cu124
    "torch>=2.1.0",
    # Logging
    "tensorboard>=2.15.0",
    "numpy>=1.24.0",
    # Video encoding (MetaDrive pulls mediapy, which needs it)
    "imageio-ffmpeg>=0.4.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
    "black>=24.0.0",
]

[project.scripts]
drive-rl-train = "drive_rl.train:main"
drive-rl-evaluate = "drive_rl.evaluate:main"
drive-rl-record = "drive_rl.record_video:main"
drive-rl-watch = "drive_rl.watch:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "ignore::DeprecationWarning:metadrive.*",
    "ignore::DeprecationWarning:stable_baselines3.*",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py310"]